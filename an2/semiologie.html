<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<title>Bibliothèque Ostéopathique — IEOQ · Année 2 · Sémiologie</title>
<script src="../auth-config.js"></script>
<script>osteoGuardPage(2);</script>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="nav.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="header-logo">📋</div>
    <div class="header-text">
      <h1>Bibliothèque — 2e Année</h1>
      <p>Sémiologie — IEOQ</p>
    </div>
    <div class="header-badges">
      <a class="badge badge-link" href="index.html">← Catégories</a>
    </div>
  </div>
</header>

<div class="crumb-bar">
  <div class="crumb-left">
    <a class="crumb-cats-link" href="index.html">← Toutes les catégories</a>
    <span class="crumb-text"><strong>Sémiologie</strong> <span id="crumbSub"></span></span>
  </div>
  <div class="site-search">
    <span class="site-search-icon">🔎</span>
    <input type="text" id="siteSearchInput" placeholder="Rechercher dans la bibliothèque…" autocomplete="off">
    <div class="site-search-results" id="siteSearchResults"></div>
  </div>
</div>


<div class="main-wrapper">
  <div class="main-content">
    <div class="section active" style="display:block;">
  <div class="section-title">Sémiologie</div>
  <div class="section-sub">Contenu à venir — IEOQ</div>
  <div class="card" style="margin-top:16px;">
    <div class="card-body" style="text-align:center;padding:36px 20px;color:var(--text2,#6b6152);">
      <div style="font-size:32px;margin-bottom:10px;">🚧</div>
      <p style="margin:0;font-size:14.5px;">Cette section n'a pas encore de contenu publié.<br>Elle apparaîtra ici dès que le cours correspondant sera ajouté.</p>
    </div>
  </div>
</div>
  </div>
</div>

<button type="button" onclick="osteoLogout()" title="Se déconnecter"
  style="position:fixed;bottom:18px;right:18px;z-index:9999;display:flex;align-items:center;gap:6px;background:#221f1a;color:#fff;border:1px solid rgba(255,255,255,0.18);border-radius:30px;padding:8px 16px;font-family:'Inter',sans-serif;font-size:12px;font-weight:500;cursor:pointer;box-shadow:0 4px 16px rgba(40,30,20,0.3);">
  ⏻ Déconnexion
</button>

<script src="app.js"></script>
<script>
  var LOCAL_IDS = [];
  var SUB_LABELS_LOCAL = {};

  function showSub(id) {
    document.querySelectorAll('.section').forEach(function (s) {
      s.classList.remove('active');
      s.style.display = 'none';
    });
    document.querySelectorAll('.nav-tab[data-sub]').forEach(function (t) {
      t.classList.toggle('active', t.dataset.sub === id);
    });
    var target = document.getElementById(id);
    if (target) {
      target.style.display = 'block';
      target.classList.add('active');
    }
    var crumb = document.getElementById('crumbSub');
    if (crumb) crumb.textContent = '\u203a ' + (SUB_LABELS_LOCAL[id] || id);
    if (history.replaceState) history.replaceState(null, '', '#' + id);
  }

  (function () {
    var hash = location.hash.replace('#', '');
    var initial = LOCAL_IDS.indexOf(hash) !== -1 ? hash : LOCAL_IDS[0];
    if (initial && initial !== LOCAL_IDS[0]) showSub(initial);

    if (hash && LOCAL_IDS.indexOf(hash) === -1) {
      setTimeout(function () {
        var el = document.getElementById(hash);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 150);
    }

    if (initial) applyHighlightFromURL(document.getElementById(initial));

    initSiteSearch(document.getElementById('siteSearchInput'), document.getElementById('siteSearchResults'), './');
  })();
</script>

</body>
</html>
